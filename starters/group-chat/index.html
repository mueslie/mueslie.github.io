<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Chat</title><style>:root{--accent:#3478c8}
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#1d1d29}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;overflow-x:hidden}body{padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:min(760px,100%);margin:0 auto}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(1.65rem,7vw,2.4rem);letter-spacing:-.045em}.hero p{margin:7px 0 0;color:#686879;line-height:1.5}.card{background:#fff;border:1px solid #e8e7ef;border-radius:18px;padding:18px;box-shadow:0 10px 32px rgba(35,31,66,.06);margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:12px}.muted{color:#717184;font-size:.9rem}.empty{text-align:center;color:#78788a;padding:30px 12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f0eff8;color:#55536a;font-size:.78rem;font-weight:700}.notice{padding:11px 13px;border-radius:12px;background:#fff7df;color:#705a16;font-size:.84rem;line-height:1.45}.error{color:#a32222}.success{color:#236c42}
button,input,textarea,select{font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#eeedf5;color:#333244}button.ghost{background:transparent;color:#55536a;border:1px solid #dedde7}button.danger{background:#fff0f0;color:#a12626}button:disabled{opacity:.55;cursor:not-allowed}input,textarea,select{width:100%;min-height:44px;border:1px solid #d9d8e2;border-radius:11px;padding:10px 12px;background:white;color:#20202b}textarea{min-height:130px;resize:vertical}label{display:grid;gap:6px;font-size:.86rem;font-weight:700;color:#505062}.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.nav button{white-space:nowrap}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #efedf4}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:22px;min-height:22px;margin-top:2px}.item-title{font-weight:750;overflow-wrap:anywhere}.item.done .item-title{text-decoration:line-through;color:#858493}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{min-height:40px;padding:7px 11px}.amount{font-variant-numeric:tabular-nums;font-weight:800}.photo{display:block;max-width:100%;max-height:360px;border-radius:14px;margin-top:12px}.sticky-compose{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:2}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;background:#eeedf5;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--accent);color:white}.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:8px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){body{padding-left:12px;padding-right:12px}.card{padding:15px;border-radius:15px}.hero{display:block}.split{grid-template-columns:1fr}.row.mobile-stack{align-items:stretch;flex-direction:column}.row.mobile-stack button{width:100%}.actions button{flex:1}.bubble{max-width:96%}}
</style></head>
<body><main>
<header class="hero"><div><h1>Group Chat</h1><p>Encrypted pairwise channels with deduplicated relay across the group.</p></div><button id="start" class="secondary">Start a chat</button></header>
<div id="channel" class="notice">Choose contacts to create a chat.</div><section id="messages" class="card" aria-live="polite"></section>
<div id="composer" class="card stack sticky-compose"><textarea id="message" rows="2" maxlength="4000" placeholder="Message"></textarea><div class="row mobile-stack"><label class="grow">Small photo (optional)<input id="chat-photo" type="file" accept="image/*"></label><button id="send-message" type="button" class="grow">Send</button></div><div class="muted">Photos are compressed below 45 KB for the signed channel payload; the full-quality original is saved to this app's Files section.</div><div id="status" class="muted"></div></div></main><script>
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const bytes=(value)=>new TextEncoder().encode(value||'').byteLength;const photoPattern=new RegExp('^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$');const safePhoto=(value)=>typeof value==='string'&&photoPattern.test(value)&&bytes(value)<=45000?value:'';let messages=[];let instanceId=null;let isRelayOwner=false;let photoDataUrl='';let photoFile=null;const localAuthorId='local-'+crypto.randomUUID();const seenMessageIds=new Set();const relayAuthors=new Map();const fileUrls=new Map();const pendingFileFetches=new Set();
const filesApi=()=>typeof $files==='undefined'?null:$files;const safeFileTag=(value)=>{const cleaned=String(value||'').replace(/[^A-Za-z0-9-]/g,'').slice(0,64);return cleaned||crypto.randomUUID();};
function dataUrlToBytes(dataUrl){const base64=String(dataUrl).split(',')[1]||'';const binary=atob(base64);const out=new Uint8Array(binary.length);for(let index=0;index<binary.length;index++)out[index]=binary.charCodeAt(index);return out;}
async function storeChatPhoto(name,mime,data){const api=filesApi();if(!api)return '';try{const existing=await api.find(name).catch(()=>null);if(existing&&existing.id)return existing.id;const record=await api.add({name,mime,data});return record&&record.id?String(record.id):'';}catch(error){return '';}}
async function compressPhoto(file){const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=reject;reader.readAsDataURL(file);});const image=new Image();image.src=source;await image.decode();const scale=Math.min(1,640/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let quality=.62;let result=canvas.toDataURL('image/jpeg',quality);while(bytes(result)>45000&&quality>.2){quality-=.07;result=canvas.toDataURL('image/jpeg',quality);}if(bytes(result)>45000)throw new Error('Photo remains too large for chat after compression.');return result;}
function render(){const rows=messages.filter((message)=>!instanceId||message.instanceId===instanceId).sort((a,b)=>String(a.sentAt).localeCompare(String(b.sentAt)));document.getElementById('messages').innerHTML=rows.length?rows.map((message,index)=>{const attachment=safePhoto(message.photoDataUrl);const hasPhoto=attachment||(typeof message.photoFileId==='string'&&message.photoFileId);return '<article class="bubble '+(message.localAuthorId===localAuthorId?'mine':'')+'"><strong>'+esc(message.authorName)+'</strong><div>'+esc(message.text)+'</div>'+(hasPhoto?'<img data-chat-photo="'+index+'" alt="Chat attachment">':'')+'<small style="display:block;margin-top:5px;opacity:.72">'+esc(new Date(message.sentAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</small></article>';}).join('<div style="height:8px"></div>'):'<div class="empty">No messages yet.</div>';rows.forEach((message,index)=>{const image=document.querySelector('[data-chat-photo="'+index+'"]');if(!image)return;const attachment=safePhoto(message.photoDataUrl);const fileId=typeof message.photoFileId==='string'?message.photoFileId:'';const fileUrl=fileId?fileUrls.get(fileId):null;if(fileUrl)image.src=fileUrl;else if(attachment)image.src=attachment;const api=filesApi();if(api&&fileId&&!fileUrls.has(fileId)&&!pendingFileFetches.has(fileId)){pendingFileFetches.add(fileId);api.objectUrl(fileId).then((url)=>{if(url)fileUrls.set(fileId,url);}).catch(()=>{}).finally(()=>{pendingFileFetches.delete(fileId);if(fileUrls.has(fileId))render();});}});document.getElementById('channel').textContent=instanceId?'Chat channel '+instanceId.slice(0,8)+'… is active.':'Choose contacts to create a chat.';}
async function publish(message,target){const attachment=safePhoto(message.photoDataUrl);await $events.publish('message.sent',{messageId:String(message.messageId),text:String(message.text),relayAuthorId:String(message.authorId),relayAuthorName:String(message.authorName),...(attachment?{photoDataUrl:attachment}:{}),sentAt:String(message.sentAt)},{instanceId:target});}
Dapp.onReady(async()=>{const shares=await $share.list();const active=shares.filter((share)=>share.shareId==='group-chat'&&share.participants.some((participant)=>participant.status==='active')).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];instanceId=active&&active.instanceId||null;if(instanceId){const ownership=await $store.query('chatState',{instanceId,relayOwner:true});isRelayOwner=ownership.length>0;}await $actions.handle('message.receive',async(payload,context)=>{const messageId=String(payload.messageId);if(seenMessageIds.has(messageId))return;seenMessageIds.add(messageId);const duplicate=await $store.query('messages',{messageId});if(duplicate.length)return;const source=context.from&&typeof context.from==='object'?context.from:{handle:'contact',displayName:'Contact'};let authorId;let authorName;if(isRelayOwner){const sourceHandle=String(source.handle||'contact');if(!relayAuthors.has(sourceHandle))relayAuthors.set(sourceHandle,'relay-'+crypto.randomUUID());authorId=relayAuthors.get(sourceHandle);authorName=String(source.displayName||'Contact');}else{authorId=typeof payload.relayAuthorId==='string'&&payload.relayAuthorId?payload.relayAuthorId:'channel-'+String(source.handle||'contact');authorName=typeof payload.relayAuthorName==='string'&&payload.relayAuthorName?payload.relayAuthorName:String(source.displayName||'Contact');}const attachment=safePhoto(payload.photoDataUrl);const received={messageId,authorId,authorName,text:String(payload.text),...(attachment?{photoDataUrl:attachment}:{}),sentAt:String(payload.sentAt),instanceId:context.instanceId};if(attachment){const fileName='chat-photo-'+safeFileTag(messageId)+'.jpg';const fileId=await storeChatPhoto(fileName,'image/jpeg',dataUrlToBytes(attachment));if(fileId){received.photoFileId=fileId;received.photoFileName=fileName;}}await $store.create('messages',received);if(isRelayOwner&&context.instanceId)await publish(received,context.instanceId);});await $store.subscribe('messages',{},(rows)=>{messages=rows;render();});render();});
document.getElementById('start').addEventListener('click',async()=>{const contacts=await $contacts.pick({label:'Start a group chat',min:1,max:16});if(!contacts.length)return;const opened=await $share.open({shareId:'group-chat',contacts});if(!opened.instanceId)return;instanceId=opened.instanceId;isRelayOwner=true;await $store.create('chatState',{instanceId,relayOwner:true});render();});
document.getElementById('chat-photo').addEventListener('change',async(event)=>{const file=event.target.files[0];if(!file)return;try{photoDataUrl=await compressPhoto(file);photoFile=file;document.getElementById('status').textContent='Photo ready.';}catch(error){photoDataUrl='';photoFile=null;document.getElementById('status').textContent=error.message;}});
document.getElementById('send-message').addEventListener('click',async()=>{if(!instanceId){document.getElementById('status').textContent='Start a chat first.';return;}const input=document.getElementById('message');const attachment=safePhoto(photoDataUrl);const message={messageId:crypto.randomUUID(),localAuthorId,authorId:localAuthorId,authorName:(Dapp.context.identity&&Dapp.context.identity.displayName)||'Me',text:input.value.trim(),...(attachment?{photoDataUrl:attachment}:{}),sentAt:new Date().toISOString(),instanceId};if(!message.text&&!attachment){document.getElementById('status').textContent='Write a message or choose a photo.';return;}if(attachment&&photoFile){const mime=photoFile.type&&photoFile.type.indexOf('image/')===0?photoFile.type:'image/jpeg';const fileName='chat-photo-'+safeFileTag(message.messageId)+'.'+(mime.split('/')[1]||'jpg');const fileId=await storeChatPhoto(fileName,mime,photoFile);if(fileId){message.photoFileId=fileId;message.photoFileName=fileName;}}await $store.create('messages',message);await publish(message,instanceId);input.value='';photoDataUrl='';photoFile=null;document.getElementById('chat-photo').value='';document.getElementById('status').textContent='';});
</script></body></html>
