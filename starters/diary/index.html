<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diary</title><style>:root{--accent:#b14e75}
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#1d1d29}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;overflow-x:hidden}body{padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:min(760px,100%);margin:0 auto}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(1.65rem,7vw,2.4rem);letter-spacing:-.045em}.hero p{margin:7px 0 0;color:#686879;line-height:1.5}.card{background:#fff;border:1px solid #e8e7ef;border-radius:18px;padding:18px;box-shadow:0 10px 32px rgba(35,31,66,.06);margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:12px}.muted{color:#717184;font-size:.9rem}.empty{text-align:center;color:#78788a;padding:30px 12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f0eff8;color:#55536a;font-size:.78rem;font-weight:700}.notice{padding:11px 13px;border-radius:12px;background:#fff7df;color:#705a16;font-size:.84rem;line-height:1.45}.error{color:#a32222}.success{color:#236c42}
button,input,textarea,select{font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#eeedf5;color:#333244}button.ghost{background:transparent;color:#55536a;border:1px solid #dedde7}button.danger{background:#fff0f0;color:#a12626}button:disabled{opacity:.55;cursor:not-allowed}input,textarea,select{width:100%;min-height:44px;border:1px solid #d9d8e2;border-radius:11px;padding:10px 12px;background:white;color:#20202b}textarea{min-height:130px;resize:vertical}label{display:grid;gap:6px;font-size:.86rem;font-weight:700;color:#505062}.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.nav button{white-space:nowrap}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #efedf4}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:22px;min-height:22px;margin-top:2px}.item-title{font-weight:750;overflow-wrap:anywhere}.item.done .item-title{text-decoration:line-through;color:#858493}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{min-height:40px;padding:7px 11px}.amount{font-variant-numeric:tabular-nums;font-weight:800}.photo{display:block;max-width:100%;max-height:360px;border-radius:14px;margin-top:12px}.sticky-compose{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:2}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;background:#eeedf5;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--accent);color:white}.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:8px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){body{padding-left:12px;padding-right:12px}.card{padding:15px;border-radius:15px}.hero{display:block}.split{grid-template-columns:1fr}.row.mobile-stack{align-items:stretch;flex-direction:column}.row.mobile-stack button{width:100%}.actions button{flex:1}.bubble{max-width:96%}}
</style></head>
<body><main>
<header class="hero"><div><h1>Diary</h1><p>Private daily notes with deliberate one-entry sharing.</p></div><button id="read" class="secondary">Reading mode</button></header>
<nav class="nav"><button data-route="/">Entries</button><button class="secondary" data-route="/entry">Write</button></nav>
<section id="calendar" class="card"></section>
<div id="entry-form" class="card stack" hidden><label>Date<input id="entry-date" type="date" required></label><label>Entry<textarea id="entry-text" maxlength="12000" required placeholder="Today…"></textarea></label><label>Photo (optional, compressed locally)<input id="photo" type="file" accept="image/*"></label><div class="notice">Photos are downscaled to 800 px and capped at 200 KB in local CRDT history. Sharing includes photos only below 48 KB.</div><img id="preview" class="photo" hidden alt="Selected photo preview"><div class="row mobile-stack"><button type="button" id="save-entry" class="grow">Save entry</button><button type="button" id="share" class="secondary grow">Share this entry</button></div><div id="status" class="muted" aria-live="polite"></div></div>
<article id="reader" class="card" hidden></article></main><script>
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const bytes=(value)=>new TextEncoder().encode(value||'').byteLength;const photoPattern=new RegExp('^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$');const safePhoto=(value,maxBytes)=>typeof value==='string'&&photoPattern.test(value)&&bytes(value)<=maxBytes?value:'';let entries=[];let route='/';let routedDate=null;let photoDataUrl='';
async function compressPhoto(file,maxBytes){const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=reject;reader.readAsDataURL(file);});const image=new Image();image.src=source;await image.decode();const scale=Math.min(1,800/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let quality=.72;let result=canvas.toDataURL('image/jpeg',quality);while(bytes(result)>maxBytes&&quality>.28){quality-=.08;result=canvas.toDataURL('image/jpeg',quality);}if(bytes(result)>maxBytes)throw new Error('Photo remains larger than 200 KB after compression.');return result;}
function selectedDate(){return document.getElementById('entry-date').value||new Date().toISOString().slice(0,10)}function currentEntry(){return entries.find((entry)=>entry.date===selectedDate());}
function render(){document.querySelectorAll('[data-route]').forEach((button)=>button.className=button.dataset.route===route?'':'secondary');document.getElementById('calendar').hidden=route!=='/';document.getElementById('entry-form').hidden=route!=='/entry';document.getElementById('reader').hidden=route!=='/full';document.getElementById('calendar').innerHTML=entries.length?entries.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map((entry)=>'<button class="item ghost" style="width:100%;text-align:left" data-date="'+esc(entry.date)+'"><span class="grow"><span class="item-title">'+esc(entry.date)+'</span><span class="muted" style="display:block">'+esc(String(entry.text).slice(0,100))+'</span></span></button>').join(''):'<div class="empty">Write your first entry.</div>';const entry=currentEntry();const preview=document.getElementById('preview');if(entry&&route==='/entry'){document.getElementById('entry-text').value=entry.text||'';photoDataUrl=safePhoto(entry.photoDataUrl,200000);preview.src=photoDataUrl;preview.hidden=!photoDataUrl;}else{photoDataUrl='';preview.removeAttribute('src');preview.hidden=true;}if(route==='/full'){const latest=currentEntry()||entries.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];const readerPhoto=latest&&safePhoto(latest.photoDataUrl,200000);document.getElementById('reader').innerHTML='<div class="row" style="justify-content:flex-end"><button class="secondary" data-exit-read>Exit reading mode</button></div>'+(latest?'<span class="pill">'+esc(latest.date)+'</span><p style="white-space:pre-wrap;line-height:1.8;font-size:1.08rem">'+esc(latest.text)+'</p>'+(readerPhoto?'<img class="photo" data-reader-photo alt="Diary attachment">':''):'<div class="empty">No entry selected.</div>');const image=document.querySelector('[data-reader-photo]');if(image&&readerPhoto)image.src=readerPhoto;}}
Dapp.onReady(async()=>{await $actions.handle('entry.receive',async(payload)=>{const attachment=safePhoto(payload.photoDataUrl,48000);await $store.create('entries',{date:String(payload.date),text:String(payload.text),...(attachment?{photoDataUrl:attachment}:{}),received:true});});const syncRoute=(next)=>{route=next;const queryDate=$router.query('date');if(queryDate){routedDate=queryDate;document.getElementById('entry-date').value=queryDate;}else if(routedDate){routedDate=null;document.getElementById('entry-date').value=new Date().toISOString().slice(0,10);}render();};const queryDate=$router.query('date');routedDate=queryDate;document.getElementById('entry-date').value=queryDate||new Date().toISOString().slice(0,10);route=$router.current();$router.subscribe(syncRoute);await $store.subscribe('entries',{},(rows)=>{entries=rows;render();});});
document.querySelector('.nav').addEventListener('click',(event)=>{if(event.target.dataset.route)$router.navigate(event.target.dataset.route);});document.getElementById('calendar').addEventListener('click',async(event)=>{const button=event.target.closest('[data-date]');if(!button)return;document.getElementById('entry-date').value=button.dataset.date;await $router.navigate('/entry');render();});document.getElementById('entry-date').addEventListener('change',render);
document.getElementById('photo').addEventListener('change',async(event)=>{const file=event.target.files[0];if(!file)return;try{photoDataUrl=await compressPhoto(file,200000);document.getElementById('preview').src=photoDataUrl;document.getElementById('preview').hidden=false;}catch(error){document.getElementById('status').textContent=error.message;}});
document.getElementById('save-entry').addEventListener('click',async()=>{const date=document.getElementById('entry-date');const text=document.getElementById('entry-text');if(!date.reportValidity()||!text.reportValidity())return;const existing=currentEntry();const value={date:selectedDate(),text:text.value.trim(),...(photoDataUrl?{photoDataUrl}:{})};if(existing)await $store.update('entries',existing.id,value);else await $store.create('entries',value);document.getElementById('status').textContent='Saved locally.';});
document.getElementById('share').addEventListener('click',async()=>{const entry=currentEntry();if(!entry){document.getElementById('status').textContent='Save this entry before sharing.';return;}const contacts=await $contacts.pick({label:'Share this diary entry',min:1,max:1});if(!contacts.length)return;const opened=await $share.open({shareId:'diary-entry',contacts});if(!opened.instanceId)return;const photo=entry.photoDataUrl&&bytes(entry.photoDataUrl)<=48000?entry.photoDataUrl:undefined;await $events.publish('entry.shared',{date:entry.date,text:entry.text,...(photo?{photoDataUrl:photo}:{})},{instanceId:opened.instanceId});document.getElementById('status').textContent=photo||!entry.photoDataUrl?'Entry shared.':'Entry shared without its large photo.';});
document.getElementById('read').addEventListener('click',async()=>{await $router.navigate('/full');await $router.setChrome('fullscreen');});document.getElementById('reader').addEventListener('click',async(event)=>{if(!event.target.closest('[data-exit-read]'))return;await $router.setChrome('standard');await $router.navigate('/entry');});
</script></body></html>
