<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Expenses</title><style>:root{--accent:#0d8f78}
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#1d1d29}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;overflow-x:hidden}body{padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:min(760px,100%);margin:0 auto}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.hero h1{margin:0;font-size:clamp(1.65rem,7vw,2.4rem);letter-spacing:-.045em}.hero p{margin:7px 0 0;color:#686879;line-height:1.5}.card{background:#fff;border:1px solid #e8e7ef;border-radius:18px;padding:18px;box-shadow:0 10px 32px rgba(35,31,66,.06);margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:12px}.muted{color:#717184;font-size:.9rem}.empty{text-align:center;color:#78788a;padding:30px 12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f0eff8;color:#55536a;font-size:.78rem;font-weight:700}.notice{padding:11px 13px;border-radius:12px;background:#fff7df;color:#705a16;font-size:.84rem;line-height:1.45}.error{color:#a32222}.success{color:#236c42}
button,input,textarea,select{font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#eeedf5;color:#333244}button.ghost{background:transparent;color:#55536a;border:1px solid #dedde7}button.danger{background:#fff0f0;color:#a12626}button:disabled{opacity:.55;cursor:not-allowed}input,textarea,select{width:100%;min-height:44px;border:1px solid #d9d8e2;border-radius:11px;padding:10px 12px;background:white;color:#20202b}textarea{min-height:130px;resize:vertical}label{display:grid;gap:6px;font-size:.86rem;font-weight:700;color:#505062}.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.nav button{white-space:nowrap}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #efedf4}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:22px;min-height:22px;margin-top:2px}.item-title{font-weight:750;overflow-wrap:anywhere}.item.done .item-title{text-decoration:line-through;color:#858493}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{min-height:40px;padding:7px 11px}.amount{font-variant-numeric:tabular-nums;font-weight:800}.photo{display:block;max-width:100%;max-height:360px;border-radius:14px;margin-top:12px}.sticky-compose{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:2}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;background:#eeedf5;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:var(--accent);color:white}.bubble img{display:block;max-width:100%;border-radius:10px;margin-top:8px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){body{padding-left:12px;padding-right:12px}.card{padding:15px;border-radius:15px}.hero{display:block}.split{grid-template-columns:1fr}.row.mobile-stack{align-items:stretch;flex-direction:column}.row.mobile-stack button{width:100%}.actions button{flex:1}.bubble{max-width:96%}}
</style></head>
<body><main>
<header class="hero"><div><h1>Shared Expenses</h1><p>Track balances locally and share only one expense at a time.</p></div><button id="friend" class="secondary">Add a friend</button></header>
<nav class="nav"><button data-route="/">Balances</button><button class="secondary" data-route="/expenses">Expenses</button><button class="secondary" data-route="/add">Add</button></nav>
<div id="status" class="notice">Channel shares send explicit expense events—not your full expense history.</div>
<section id="balances" class="card"></section><section id="expenses" class="card" hidden></section>
<div id="expense-form" class="card stack" hidden><div class="split"><label>Payer<select id="payer"></select></label><label>Amount<input id="amount" type="number" min="0.01" step="0.01" required></label></div><label>Note<input id="note" maxlength="160" placeholder="Dinner"></label><label>Date<input id="date" type="date" required></label><fieldset id="splits" class="card stack"><legend>Split among</legend></fieldset><button id="add-expense" type="button">Add expense</button></div></main><script>
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let members=[];let expenses=[];let route='/';
function money(value){return new Intl.NumberFormat(undefined,{style:'currency',currency:'EUR'}).format(value||0)}
function canSettle(){return Dapp.context.role==='owner'||(Dapp.context.appRole&&Dapp.context.appRole.id==='settle-up');}
function render(){document.querySelectorAll('[data-route]').forEach((button)=>button.className=button.dataset.route===route?'':'secondary');document.getElementById('balances').hidden=route!=='/';document.getElementById('expenses').hidden=route!=='/expenses';document.getElementById('expense-form').hidden=route!=='/add';const balance=new Map(members.map((m)=>[m.id,0]));expenses.filter((expense)=>!expense.settled).forEach((expense)=>{const splits=expense.splitAmongIds||[];const share=splits.length?Number(expense.amount)/splits.length:0;balance.set(expense.payerId,(balance.get(expense.payerId)||0)+Number(expense.amount));splits.forEach((id)=>balance.set(id,(balance.get(id)||0)-share));});document.getElementById('balances').innerHTML=members.length?members.map((member)=>'<div class="item"><div class="grow"><div class="item-title">'+esc(member.name)+'</div><div class="muted">'+(member.instanceId?'Private expense channel ready':'Local participant')+'</div></div><span class="amount">'+money(balance.get(member.id))+'</span></div>').join(''):'<div class="empty">Add a participant to start.</div>';document.getElementById('expenses').innerHTML=expenses.length?expenses.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map((expense)=>'<div class="item"><div class="grow"><div class="item-title">'+esc(expense.note||'Expense')+'</div><div class="muted">'+esc(expense.payerName)+' · '+esc(expense.date)+(expense.received?' · shared slice':'')+(expense.settled?' · settled':'')+'</div></div><span class="amount">'+money(expense.amount)+'</span>'+(!expense.settled&&canSettle()?'<button class="secondary" data-settle="'+esc(expense.id)+'">Mark settled</button>':'')+'</div>').join(''):'<div class="empty">No expenses yet.</div>';document.getElementById('payer').innerHTML=members.map((member)=>'<option value="'+esc(member.id)+'">'+esc(member.name)+'</option>').join('');document.getElementById('splits').innerHTML='<legend>Split among</legend>'+members.map((member)=>'<label class="row"><input style="width:22px;min-height:22px" type="checkbox" name="split" value="'+esc(member.id)+'" checked><span>'+esc(member.name)+'</span></label>').join('');}
async function ensureMe(){const mine=await $store.query('members',{kind:'me'});if(mine.length)return mine[0];return $store.create('members',{name:(Dapp.context.identity&&Dapp.context.identity.displayName)||'Me',kind:'me'});}
async function ensureContact(instanceId,contact){const existing=await $store.query('members',{instanceId});if(existing.length)return existing[0];return $store.create('members',{name:(contact&&contact.displayName)||'Contact',handle:contact&&contact.handle,instanceId,kind:'contact'});}
async function syncShareParticipants(){const shares=await $share.list();for(const share of shares.filter((item)=>item.shareId==='expense-settlement'))for(const participant of share.participants.filter((item)=>item.status==='active'))await ensureContact(share.instanceId,participant.contact);}
Dapp.onReady(async()=>{await $actions.handle('expense.receive',async(payload,context)=>{const duplicate=await $store.query('expenses',{externalId:payload.expenseId});if(duplicate.length)return;const mine=await ensureMe();const contact=await ensureContact(context.instanceId,context.from);const resolve=(role)=>role==='sender'?contact.id:role==='recipient'?mine.id:null;const payerId=resolve(payload.payerId);const splitAmongIds=(payload.splitAmongIds||[]).map(resolve).filter(Boolean);if(!payerId||!splitAmongIds.length)return;await $store.create('expenses',{...payload,payerId,payerName:payload.payerId==='sender'?contact.name:mine.name,splitAmongIds,externalId:payload.expenseId,received:true,instanceId:context.instanceId});});await ensureMe();await syncShareParticipants();route=$router.current();$router.subscribe((next)=>{route=next;render();});await $store.subscribe('members',{},(rows)=>{members=rows;render();});await $store.subscribe('expenses',{},(rows)=>{expenses=rows;render();});document.getElementById('date').value=new Date().toISOString().slice(0,10);});
document.querySelector('.nav').addEventListener('click',(event)=>{if(event.target.dataset.route)$router.navigate(event.target.dataset.route);});
document.getElementById('friend').addEventListener('click',async()=>{const picked=await $contacts.pick({label:'Choose one expense participant',min:1,max:1});if(!picked.length)return;const opened=await $share.open({shareId:'expense-settlement',contacts:picked});if(!opened.instanceId)return;await ensureContact(opened.instanceId,picked[0]);});
document.getElementById('expenses').addEventListener('click',async(event)=>{const expenseId=event.target.dataset.settle;if(!expenseId||!canSettle())return;await $store.update('expenses',expenseId,{settled:true,settledAt:new Date().toISOString()});});
document.getElementById('add-expense').addEventListener('click',async()=>{const amount=document.getElementById('amount');const date=document.getElementById('date');if(!amount.reportValidity()||!date.reportValidity())return;const payerId=document.getElementById('payer').value;const payer=members.find((m)=>m.id===payerId);const splitAmongIds=Array.from(document.querySelectorAll('[name=split]:checked')).map((input)=>input.value);if(!payer||!splitAmongIds.length){document.getElementById('status').textContent='Choose a payer and at least one participant.';return;}const expense=await $store.create('expenses',{payerId,payerName:payer.name,amount:Number(amount.value),splitAmongIds,note:document.getElementById('note').value.trim(),date:date.value});const mine=members.find((member)=>member.kind==='me');for(const member of members.filter((item)=>item.instanceId)){const senderOwes=expense.payerId===member.id&&mine&&splitAmongIds.includes(mine.id);const recipientOwes=mine&&expense.payerId===mine.id&&splitAmongIds.includes(member.id);if(!senderOwes&&!recipientOwes)continue;await $events.publish('expense.shared',{expenseId:expense.id,payerId:senderOwes?'recipient':'sender',payerName:expense.payerName,amount:Number(expense.amount)/splitAmongIds.length,splitAmongIds:[senderOwes?'sender':'recipient'],note:expense.note,date:expense.date},{instanceId:member.instanceId});}amount.value='';document.getElementById('note').value='';document.getElementById('status').textContent='Expense added.';await $router.navigate('/expenses');});
</script></body></html>
